name: Canonical intelligence publish

on:
  push:
    branches: [main]
    paths:
      # Scheduled content publishing writes this marker LAST, after canonical data,
      # homepage markup and the daily snapshot are all complete.
      - 'data/publish/**'
      # Pipeline/frontend changes may rebuild the current release for verification.
      - 'scripts/build_intelligence.py'
      - 'scripts/render_daily_navigation.py'
      - 'scripts/check_release_input.py'
      - 'scripts/check_registry_contract.py'
      - 'scripts/check_pipeline_contract.py'
      - 'scripts/check_intelligence_contract.py'
      - 'scripts/extract_visual_assets.py'
      - 'scripts/inject_visual_previews.py'
      - 'scripts/check_visual_contract.py'
      - 'scripts/apply_cache_bust.py'
      - 'canonical-client.js'
      - 'home.js'
      - 'daily.js'
      - '.github/workflows/intelligence-build.yml'
  workflow_dispatch:
    inputs:
      date:
        description: 'Canonical report date (YYYY-MM-DD); blank = latest'
        required: false
        type: string
  issues:
    types: [opened, reopened]

permissions:
  contents: write

# Single Writer Rule: every trigger shares one global lock. Manual, push and issue
# reruns must never render/commit the site concurrently.
concurrency:
  group: canonical-intelligence-publish
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'rerun-canonical:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: pip install beautifulsoup4 requests pillow

      - name: Validate publishing topology
        run: python scripts/check_pipeline_contract.py

      - name: Resolve canonical date
        id: date
        shell: bash
        env:
          REQUESTED_DATE: ${{ github.event.inputs.date }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          extract_date() {
            printf '%s\n' "$1" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' | head -1 || true
          }

          candidate=""
          source="latest"

          if [ -n "${REQUESTED_DATE:-}" ]; then
            candidate="$(extract_date "$REQUESTED_DATE")"
            source="workflow_dispatch"
          elif [ "${EVENT_NAME:-}" = "issues" ] && [[ "${ISSUE_TITLE:-}" == rerun-canonical:* ]]; then
            candidate="$(extract_date "$ISSUE_TITLE")"
            source="issue_title"
          elif [ "${EVENT_NAME:-}" = "push" ]; then
            ready=""
            if [ -n "${BEFORE_SHA:-}" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              ready="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'data/publish/*.ready' | sort | tail -1)"
            fi
            if [ -n "$ready" ]; then
              candidate="$(extract_date "$(basename "$ready" .ready)")"
              source="ready_marker"
            fi
          fi

          if [ -z "$candidate" ]; then
            candidate="$(find data/daily -maxdepth 1 -name '20??-??-??.json' -printf '%f\n' | sed 's/.json$//' | sort | tail -1)"
            source="latest_dataset"
          fi

          if ! [[ "$candidate" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid canonical date resolved from $source: '$candidate'"
            exit 1
          fi

          if [ ! -f "data/daily/$candidate.json" ]; then
            echo "Missing canonical dataset: $candidate (source=$source)"
            exit 1
          fi

          echo "value=$candidate" >> "$GITHUB_OUTPUT"
          echo "Publishing canonical date: $candidate (source=$source)"

      # One-time compatibility only. New dates MUST already contain stable IDs and
      # roles in source markup; the preflight below will reject missing identity.
      - name: Legacy 2026-08-23 stable-ID migration
        if: steps.date.outputs.value == '2026-08-23'
        run: python scripts/bootstrap_intelligence_ids.py

      - name: Release-ready input preflight
        run: python scripts/check_release_input.py "${{ steps.date.outputs.value }}"

      - name: Validate published registry / dedupe contract
        run: python scripts/check_registry_contract.py

      - name: Render archive previous/next navigation
        run: python scripts/render_daily_navigation.py

      - name: Render canonical Full Analysis into both views
        run: python scripts/build_intelligence.py "${{ steps.date.outputs.value }}"

      - name: Extract representative visuals with retry and diagnostics
        run: python scripts/extract_visual_assets.py "${{ steps.date.outputs.value }}"

      - name: Inject local previews by stable intelligence ID
        run: python scripts/inject_visual_previews.py "${{ steps.date.outputs.value }}"

      - name: Apply deterministic release cache bust
        run: python scripts/apply_cache_bust.py "${{ steps.date.outputs.value }}"

      - name: Full publish contract QA
        run: |
          python scripts/check_intelligence_contract.py
          python scripts/check_visual_contract.py "${{ steps.date.outputs.value }}"
          python scripts/check_home_contract.py
          python scripts/check_daily_contract.py

      - name: Print visual coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f assets/visual/manifest.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('assets/visual/manifest.json').read_text())
          print('Visual manifest date:', d.get('date'))
          for x in d.get('entries',[]):
              print(f"- {x.get('id')}: {x.get('status')} candidates={x.get('candidate_count',0)} error={x.get('error','')}")
          PY
          fi

      - name: Atomic publish derived assets and views
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add assets/visual
          git add index.html
          # Navigation rendering may update the previous day's next pointer, so all
          # archive index pages are part of the same atomic structural publication.
          find . -maxdepth 2 -mindepth 2 -path './20??-??-??/index.html' -print0 | xargs -0 -r git add --

          if git diff --cached --quiet; then
            echo "Canonical assets and rendered views already current"
            exit 0
          fi

          git commit -m "Publish canonical intelligence ${{ steps.date.outputs.value }}"

          # Working tree must be clean here. If main changed during this run and
          # conflicts with the same derived files, fail rather than overwrite it.
          git pull --rebase origin main
          git push origin HEAD:main
