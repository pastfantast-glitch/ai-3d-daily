name: Canonical intelligence publish

on:
  push:
    branches: [main]
    paths:
      - 'data/publish/*.ready'
  workflow_dispatch:
    inputs:
      date:
        description: 'Canonical report date (YYYY-MM-DD); blank = latest'
        required: false
        type: string
      recovery_sha:
        description: 'Optional known-good Publish commit SHA to restore derived publication surfaces'
        required: false
        type: string
  issues:
    types: [opened, reopened]

permissions:
  contents: write

concurrency:
  group: canonical-intelligence-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name != 'issues' || startsWith(github.event.issue.title, 'rerun-canonical:')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.recovery_sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked pipeline dependencies
        run: pip install -r requirements-pipeline.txt
      - name: Validate publishing topology
        run: python scripts/check_pipeline_contract.py
      - name: Resolve canonical date
        id: date
        shell: bash
        env:
          REQUESTED_DATE: ${{ github.event.inputs.date }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          extract_date() { printf '%s\n' "$1" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' | head -1 || true; }
          candidate=""; source="latest"
          if [ -n "${REQUESTED_DATE:-}" ]; then candidate="$(extract_date "$REQUESTED_DATE")"; source="workflow_dispatch"
          elif [ "${EVENT_NAME:-}" = "issues" ] && [[ "${ISSUE_TITLE:-}" == rerun-canonical:* ]]; then candidate="$(extract_date "$ISSUE_TITLE")"; source="issue_title"
          elif [ "${EVENT_NAME:-}" = "push" ]; then
            ready=""
            if [ -n "${BEFORE_SHA:-}" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then ready="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'data/publish/*.ready' | sort | tail -1)"; fi
            if [ -n "$ready" ]; then candidate="$(extract_date "$(basename "$ready" .ready)")"; source="ready_marker"; fi
          fi
          if [ -z "$candidate" ]; then candidate="$(find data/daily -maxdepth 1 -name '20??-??-??.json' -printf '%f\n' | sed 's/.json$//' | sort | tail -1)"; source="latest_dataset"; fi
          if ! [[ "$candidate" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then echo "Invalid canonical date resolved from $source: '$candidate'"; exit 1; fi
          if [ ! -f "data/daily/$candidate.json" ]; then echo "Missing canonical dataset: $candidate (source=$source)"; exit 1; fi
          echo "value=$candidate" >> "$GITHUB_OUTPUT"; echo "Publishing canonical date: $candidate (source=$source)"
      - name: Legacy 2026-08-23 stable-ID migration
        if: steps.date.outputs.value == '2026-08-23'
        run: python scripts/bootstrap_intelligence_ids.py
      - name: Normalize current canonical against published registry
        run: python scripts/normalize_registry_identity.py "${{ steps.date.outputs.value }}"
      - name: Enrich canonical V3 Full Analysis depth
        run: python scripts/enrich_full_analysis_v3.py "${{ steps.date.outputs.value }}"
      - name: Normalize current release seed semantic shell
        run: python scripts/normalize_release_seed.py "${{ steps.date.outputs.value }}"
      - name: Release-ready input preflight
        run: python scripts/check_release_input.py "${{ steps.date.outputs.value }}"
      - name: Validate published registry / dedupe contract
        run: python scripts/check_registry_contract.py
      - name: Render archive previous/next navigation and shared presentation
        run: python scripts/render_daily_navigation.py
      - name: Render homepage history list from actual archives
        run: python scripts/render_home_archive_links.py
      - name: Render V2 information architecture and category pages
        run: python scripts/render_information_architecture.py "${{ steps.date.outputs.value }}"
      - name: Render canonical Full Analysis into all views
        run: python scripts/build_intelligence.py "${{ steps.date.outputs.value }}"
      - name: Extract representative visuals with retry and diagnostics
        run: python scripts/extract_visual_assets.py "${{ steps.date.outputs.value }}"
      - name: Inject local previews by stable intelligence ID
        run: python scripts/inject_visual_previews.py "${{ steps.date.outputs.value }}"
      - name: Apply deterministic release cache bust
        run: python scripts/apply_cache_bust.py "${{ steps.date.outputs.value }}"
      - name: Full publish contract QA
        run: |
          python scripts/check_intelligence_contract.py
          python scripts/check_visual_contract.py "${{ steps.date.outputs.value }}"
          python scripts/check_home_contract.py
          python scripts/check_daily_contract.py
          python scripts/check_information_architecture.py "${{ steps.date.outputs.value }}"
          python scripts/check_historical_regression.py --days 4
      - name: Print visual coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f assets/visual/manifest.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('assets/visual/manifest.json').read_text())
          print('Visual manifest date:', d.get('date'))
          for x in d.get('entries',[]): print(f"- {x.get('id')}: {x.get('status')} candidates={x.get('candidate_count',0)} error={x.get('error','')}")
          PY
          fi
      - name: Atomic publish canonical data, derived assets and views
        id: publish_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "data/daily/${{ steps.date.outputs.value }}.json" assets/visual index.html
          find . -maxdepth 2 -mindepth 2 -path './20??-??-??/index.html' -print0 | xargs -0 -r git add --
          find "${{ steps.date.outputs.value }}" -mindepth 2 -maxdepth 2 -name index.html -print0 | xargs -0 -r git add --
          # Renderers may legitimately update additional tracked derived files.
          # Stage tracked modifications/deletions without admitting unrelated untracked files.
          git add -u
          echo 'Atomic publish worktree status:'
          git status --short
          if git diff --cached --quiet; then
            publish_sha="$(git log -1 --format=%H --grep="^Publish canonical intelligence ${{ steps.date.outputs.value }}$")"
            test -n "$publish_sha" || { echo "No prior publish commit found for current rendered state"; exit 1; }
          else
            git commit -m "Publish canonical intelligence ${{ steps.date.outputs.value }}"
            git pull --rebase origin main
            git push origin HEAD:main
            publish_sha="$(git rev-parse HEAD)"
          fi
          echo "publish_sha=$publish_sha" >> "$GITHUB_OUTPUT"
      - name: Verify public GitHub Pages release
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/verify_pages_publish.py "${{ steps.date.outputs.value }}" --base-url "$SITE_URL" --attempts 8 --delay 15
      - name: Write verified publish receipt
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python scripts/write_publish_receipt.py "${{ steps.date.outputs.value }}" --publish-sha "${{ steps.publish_commit.outputs.publish_sha }}" --run-id "${{ github.run_id }}" --site-url "$SITE_URL"
      - name: Commit operational receipt metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "data/publish/${{ steps.date.outputs.value }}.done.json" data/publish/latest-success.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record verified publish ${{ steps.date.outputs.value }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish success summary
        if: success()
        run: |
          echo "## Canonical publish DONE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Date: ${{ steps.date.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish commit: ${{ steps.publish_commit.outputs.publish_sha }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish failure summary
        if: failure()
        run: |
          echo "## Canonical publish FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "- No DONE receipt is written on failure." >> "$GITHUB_STEP_SUMMARY"
  recovery:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.recovery_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Restore known-good derived publication snapshot
        env:
          RECOVERY_SHA: ${{ github.event.inputs.recovery_sha }}
        run: python scripts/restore_publish_snapshot.py --target "$RECOVERY_SHA" --apply
      - name: Commit recovery without rewriting history
        shell: bash
        env:
          RECOVERY_SHA: ${{ github.event.inputs.recovery_sha }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover canonical publication from $RECOVERY_SHA"
          git pull --rebase origin main
          git push origin HEAD:main
