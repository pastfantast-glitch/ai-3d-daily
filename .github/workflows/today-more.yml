name: Refresh supplemental daily intelligence

on:
  push:
    branches: [main]
    paths:
      - 'today-more.json'
      - 'scripts/inject_today_more.py'
      - 'visual-assets.json'
      - '.github/workflows/today-more.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intelligence-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Inject supplemental cards
        run: python scripts/inject_today_more.py
      - name: Refresh visual assets
        run: python scripts/extract_visual_assets.py
      - name: Inject visual previews
        run: python scripts/inject_visual_previews.py
      - name: Homepage contract QA
        run: python scripts/check_home_contract.py
      - name: Commit refreshed daily intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 2026-08-*/index.html assets/visual home-content.css styles.css
          if git diff --cached --quiet; then
            echo "No content changes"
          else
            git commit -m "Refresh supplemental daily intelligence"
            git push
          fi
