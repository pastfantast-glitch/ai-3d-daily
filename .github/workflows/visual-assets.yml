name: Refresh visual evidence assets

on:
  push:
    branches: [main]
    paths:
      - 'visual-assets.json'
      - 'scripts/extract_visual_assets.py'
      - '.github/workflows/visual-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Extract and normalize article images
        run: python scripts/extract_visual_assets.py
      - name: Commit generated visual assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visual
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "Refresh visual evidence assets"
            git push
          fi
