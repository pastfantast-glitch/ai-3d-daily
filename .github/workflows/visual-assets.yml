name: Refresh canonical visual evidence

on:
  push:
    branches: [main]
    paths:
      - 'data/daily/**'
      - 'scripts/extract_visual_assets.py'
      - 'scripts/inject_visual_previews.py'
      - 'scripts/check_visual_contract.py'
      - '.github/workflows/visual-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intelligence-refresh
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Resolve latest canonical date
        id: date
        shell: bash
        run: echo "value=$(find data/daily -maxdepth 1 -name '20??-??-??.json' -printf '%f\n' | sed 's/.json$//' | sort | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Extract representative images by stable intelligence ID
        run: python scripts/extract_visual_assets.py "${{ steps.date.outputs.value }}"
      - name: Inject local previews by stable intelligence ID
        run: python scripts/inject_visual_previews.py "${{ steps.date.outputs.value }}"
      - name: Canonical visual contract QA
        run: python scripts/check_visual_contract.py "${{ steps.date.outputs.value }}"
      - name: Existing content and layout QA
        run: |
          python scripts/check_intelligence_contract.py
          python scripts/check_home_contract.py
          python scripts/check_daily_contract.py
      - name: Commit generated assets and preview markup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visual index.html
          git add "${{ steps.date.outputs.value }}/index.html"
          if git diff --cached --quiet; then
            echo "No canonical visual changes"
          else
            git commit -m "Refresh canonical visual evidence for ${{ steps.date.outputs.value }}"
            git push
          fi
