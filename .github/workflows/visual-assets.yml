name: Refresh visual evidence assets

on:
  push:
    branches: [main]
    paths:
      - 'visual-assets.json'
      - 'scripts/extract_visual_assets.py'
      - 'scripts/inject_visual_previews.py'
      - '.github/workflows/visual-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intelligence-refresh
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Extract and normalize article images
        run: python scripts/extract_visual_assets.py
      - name: Inject local previews into site
        run: python scripts/inject_visual_previews.py
      - name: Homepage contract QA
        run: python scripts/check_home_contract.py
      - name: Commit generated visual assets and preview markup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visual index.html home-content.css styles.css
          find . -maxdepth 2 -type f -path './20??-??-??/index.html' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo "No visual asset or preview changes"
          else
            git commit -m "Refresh visual evidence assets and previews"
            git push
          fi
