name: Historical regression matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked pipeline dependencies
        run: pip install -r requirements-pipeline.txt
      - name: Validate publishing topology and config wiring
        run: python scripts/check_pipeline_contract.py
      - name: Run config-driven collection contract dry run
        run: python scripts/check_collection_contract.py
      - name: Run historical archive regression matrix
        run: python scripts/check_historical_regression.py --days 4
