name: Daily source contract QA

on:
  push:
    branches:
      - main
    paths:
      - 'requirements-pipeline.txt'
      - 'styles.css'
      - 'daily.css'
      - 'daily.js'
      - 'home.js'
      - 'canonical-client.js'
      - 'archive-nav-state.js'
      - 'preference.js'
      - 'cloud-sync.js'
      - 'cloud-sync-v2.js'
      - 'cloud-sync-v3.js'
      - 'cloud-sync-owner.js'
      - 'saved.js'
      - 'saved.css'
      - 'saved/**'
      - 'shared-components.css'
      - 'home.css'
      - 'home-content.css'
      - 'home-components.css'
      - 'category.css'
      - 'config/intelligence-v2.json'
      - 'config/discovery-hybrid.json'
      - 'config/full-analysis-depth.json'
      - 'config/quick-impact-contract.json'
      - 'config/stability-contract.json'
      - 'config/personalization-feedback.json'
      - 'config/collection-session.schema.json'
      - 'config/pipeline-health.json'
      - 'data/candidates/rolling-backlog.json'
      - 'scripts/policy_resolver.py'
      - 'scripts/intelligence_v2.py'
      - 'scripts/url_identity.py'
      - 'scripts/discovery_hybrid.py'
      - 'scripts/personalization_feedback.py'
      - 'scripts/check_personalization_feedback_contract.py'
      - 'scripts/check_discovery_hybrid_contract.py'
      - 'scripts/check_tier_assignment_contract.py'
      - 'scripts/check_analysis_reading_contract.py'
      - 'scripts/check_policy_resolver_contract.py'
      - 'scripts/check_source_qa_coverage.py'
      - 'scripts/check_collection_session_contract.py'
      - 'scripts/finalize_collection_handoff.py'
      - 'scripts/finalize_collector_trigger.py'
      - 'scripts/create_collector_trigger.py'
      - 'scripts/check_main_ci.py'
      - 'scripts/test_main_ci.py'
      - 'scripts/check_pipeline_health_contract.py'
      - 'scripts/check_collection_contract.py'
      - 'scripts/check_stability_contract.py'
      - 'scripts/check_quick_impact_contract.py'
      - 'scripts/check_preference_contract.py'
      - 'scripts/check_cloud_sync_contract.py'
      - 'scripts/check_pages_tier_contract.py'
      - 'scripts/prepare_release_candidate.py'
      - 'scripts/check_ready_contract.py'
      - 'scripts/normalize_registry_identity.py'
      - 'scripts/normalize_registry_identity_hybrid.py'
      - 'scripts/apply_analysis_overrides.py'
      - 'scripts/enrich_full_analysis_v3.py'
      - 'scripts/normalize_release_seed.py'
      - 'scripts/check_release_input.py'
      - 'scripts/check_release_input_core.py'
      - 'scripts/check_release_input_hybrid.py'
      - 'scripts/check_registry_contract.py'
      - 'scripts/check_pipeline_contract.py'
      - 'scripts/check_release_architecture.py'
      - 'scripts/check_intelligence_contract.py'
      - 'scripts/check_visual_contract.py'
      - 'scripts/check_visual_extractor_contract.py'
      - 'scripts/check_daily_contract.py'
      - 'scripts/check_home_contract.py'
      - 'scripts/render_daily_navigation.py'
      - 'scripts/render_home_archive_links.py'
      - 'scripts/normalize_archive_presentation.py'
      - 'scripts/render_information_architecture.py'
      - 'scripts/check_information_architecture.py'
      - 'scripts/build_intelligence.py'
      - 'scripts/extract_visual_assets.py'
      - 'scripts/inject_visual_previews.py'
      - 'scripts/apply_cache_bust.py'
      - 'scripts/check_historical_regression.py'
      - 'scripts/verify_pages_publish.py'
      - 'scripts/write_publish_receipt.py'
      - 'scripts/restore_publish_snapshot.py'
      - 'scripts/build_published_registry_snapshot.py'
      - 'scripts/bootstrap_intelligence_ids.py'
      - '.github/workflows/collector-handoff.yml'
      - '.github/workflows/intelligence-build.yml'
      - '.github/workflows/daily-contract.yml'
      - '.github/workflows/historical-regression.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked pipeline dependencies
        run: pip install -r requirements-pipeline.txt
      - name: Validate release architecture, source topology, hybrid discovery, personalization and stability contracts
        run: |
          node --check preference.js
          node --check cloud-sync-owner.js
          python scripts/check_release_architecture.py
          python scripts/check_source_qa_coverage.py
          python scripts/test_main_ci.py
          python scripts/check_policy_resolver_contract.py
          python scripts/check_tier_assignment_contract.py
          python scripts/check_analysis_reading_contract.py
          python scripts/check_pipeline_contract.py
          python scripts/check_collection_contract.py
          python scripts/check_collection_session_contract.py
          python scripts/check_discovery_hybrid_contract.py
          python scripts/check_personalization_feedback_contract.py
          python scripts/check_stability_contract.py
          python scripts/check_pipeline_health_contract.py
          python scripts/check_preference_contract.py
          python scripts/check_cloud_sync_contract.py
          python scripts/check_pages_tier_contract.py
          python scripts/check_visual_extractor_contract.py
      - name: Rebuild stable sentinels and latest reports in isolation
        run: python scripts/check_historical_regression.py --days 4
