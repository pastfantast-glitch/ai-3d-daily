name: Daily report contract QA

on:
  push:
    branches: [main]
    paths:
      - '20??-??-??/index.html'
      - 'styles.css'
      - 'daily.css'
      - 'daily.js'
      - 'scripts/migrate_daily_reports.py'
      - 'scripts/check_daily_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Validate daily report presentation contract
        run: python scripts/check_daily_contract.py
