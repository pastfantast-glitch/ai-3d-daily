name: Collector handoff gate

on:
  push:
    branches: [main]
    paths:
      - 'data/candidates/collection-session/*.json'
  workflow_run:
    workflows: ['Autonomous daily Collector']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: 'Persisted Collector date (YYYY-MM-DD)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: collector-handoff-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Resolve persisted Collector date
        id: date
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REQUESTED_DATE: ${{ github.event.inputs.date }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          proceed=true
          date=""
          policy_republish=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            date="${REQUESTED_DATE:-}"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "${WORKFLOW_RUN_CONCLUSION:-}" != "success" ]; then
              echo "Autonomous Collector did not succeed; no handoff marker will be created."
              proceed=false
            else
              route_dir="$RUNNER_TEMP/collector-target-$UPSTREAM_RUN_ID"
              mkdir -p "$route_dir"
              count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "collector-target-'"$UPSTREAM_RUN_ID"'")] | length')"
              test "$count" -le 1 || { echo "Ambiguous Collector target artifacts"; exit 1; }
              if [ "$count" -eq 0 ]; then
                echo "No target artifact from this Collector run; no unrelated session will be selected."
                proceed=false
              else
                gh run download "$UPSTREAM_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "collector-target-$UPSTREAM_RUN_ID" --dir "$route_dir"
                export COLLECTOR_TARGET_PATH="$route_dir/collector-target.json"
                resolved="$(python - <<'PYCODE'
          import json, os, shlex, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from handoff_route import collector_target, pending_session
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          target = json.loads(Path(os.environ['COLLECTOR_TARGET_PATH']).read_text())
          date, policy = collector_target(event['workflow_run'], target)
          print('date=' + shlex.quote(date))
          print('policy_republish=' + str(policy).lower())
          print('proceed=' + str(pending_session(Path('.'), date, policy)).lower())
          PYCODE
                )"
                eval "$resolved"
              fi
            fi
          else
            files="$(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$AFTER_SHA")"
            dates="$(
              printf '%s\n' "$files" \
                | grep -E '^data/candidates/collection-session/20[0-9]{2}-[0-9]{2}-[0-9]{2}\.json$' \
                | sed -E 's#^.*/(20[0-9]{2}-[0-9]{2}-[0-9]{2})\.json$#\1#' \
                | sort -u
            )"
            count="$(printf '%s\n' "$dates" | sed '/^$/d' | wc -l | tr -d ' ')"
            test "$count" -eq 1 || {
              echo "Expected exactly one persisted collection-session date in this push; got $count"
              exit 1
            }
            date="$dates"
            head_message="$(git log -1 --format=%s "$AFTER_SHA")"
            if [[ "$head_message" == "Recollect production intelligence "* ]]; then
              policy_republish=true
            fi
          fi

          if [ "$proceed" = "true" ]; then
            [[ "$date" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || {
              echo "Invalid Collector date: '$date'"
              exit 1
            }
            echo "Collector handoff date: $date"
          fi
          echo "value=$date" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "policy_republish=$policy_republish" >> "$GITHUB_OUTPUT"

      - name: Confirm checkout is still current main
        if: steps.date.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          test "$head_sha" = "$main_sha" || {
            echo "Current main moved after this Collector session was observed: HEAD=$head_sha origin/main=$main_sha"
            exit 1
          }

      - name: Confirm canonical writer is idle
        if: steps.date.outputs.proceed == 'true'
        id: writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          queued="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/intelligence-build.yml/runs?branch=main&status=queued&per_page=100" \
            --jq '.total_count')"
          running="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/intelligence-build.yml/runs?branch=main&status=in_progress&per_page=100" \
            --jq '.total_count')"
          active=$((queued + running))
          echo "active=$active" >> "$GITHUB_OUTPUT"
          if [ "$active" -ne 0 ]; then
            echo "Canonical intelligence publish already has $active queued/in-progress writer run(s)."
            echo "No .collector trigger will be created; existing canonical writer remains authoritative."
            exit 1
          fi
          echo "Canonical writer idle confirmed."

      - name: Validate persisted Collector artifacts and create trigger
        if: steps.date.outputs.proceed == 'true'
        env:
          DATE: ${{ steps.date.outputs.value }}
        run: |
          if [ "${{ steps.date.outputs.policy_republish }}" = "true" ]; then
            python scripts/create_collector_trigger.py "$DATE" --writer-idle-confirmed --allow-done-policy-republish
          else
            python scripts/create_collector_trigger.py "$DATE" --writer-idle-confirmed
          fi

      - name: Reconfirm main has not moved
        if: steps.date.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Current main moved during Collector gate; refusing to publish a trigger from stale state."
            exit 1
          }

      - name: Commit sole Collector handoff marker
        if: steps.date.outputs.proceed == 'true'
        shell: bash
        env:
          DATE: ${{ steps.date.outputs.value }}
        run: |
          set -euo pipefail
          trigger="data/publish/$DATE.collector"
          test -f "$trigger" || {
            echo "Missing repository-generated Collector trigger: $trigger"
            exit 1
          }

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$trigger"

          staged="$(git diff --cached --name-only)"
          test "$staged" = "$trigger" || {
            echo "Collector gate attempted to stage unexpected paths:"
            printf '%s\n' "$staged"
            exit 1
          }

          git commit -m "Collector handoff $DATE"
          git push origin HEAD:main

      - name: Bind downstream route to this handoff
        if: success() && steps.date.outputs.proceed == 'true'
        env:
          DATE: ${{ steps.date.outputs.value }}
        run: |
          python - <<'PYCODE'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from handoff_route import route_receipt
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = route_receipt(Path('.'), os.environ['DATE'], commit, os.environ['GITHUB_RUN_ID'])
          Path(os.environ['RUNNER_TEMP'], 'collector-handoff-route.json').write_text(json.dumps(receipt))
          PYCODE

      - name: Preserve exact handoff route
        if: success() && steps.date.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: collector-handoff-route-${{ github.run_id }}
          path: ${{ runner.temp }}/collector-handoff-route.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      - name: Handoff summary
        if: success() && steps.date.outputs.proceed == 'true'
        run: |
          echo "## Collector handoff persisted" >> "$GITHUB_STEP_SUMMARY"
          echo "- Date: ${{ steps.date.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: data/publish/${{ steps.date.outputs.value }}.collector" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical intelligence publish will own CI gate, Registry preflight, request, ready, publish, Pages QA and DONE." >> "$GITHUB_STEP_SUMMARY"

      - name: Handoff no-op summary
        if: success() && steps.date.outputs.proceed != 'true'
        run: |
          echo "## Collector handoff no-op" >> "$GITHUB_STEP_SUMMARY"
          echo "- No pending persisted Collector session required a marker." >> "$GITHUB_STEP_SUMMARY"
