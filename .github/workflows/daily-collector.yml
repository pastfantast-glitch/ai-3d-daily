name: Autonomous daily Collector

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Collector date (YYYY-MM-DD); blank = current Asia/Taipei date'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'config/collector-runtime.json'
      - 'scripts/run_daily_collector.py'
      - 'scripts/check_collector_runtime_contract.py'
      - '.github/workflows/daily-collector.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: autonomous-daily-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collector-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Resolve Collector date and preflight single-writer state
        id: preflight
        shell: bash
        env:
          REQUESTED_DATE: ${{ github.event.inputs.date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          date="${REQUESTED_DATE:-}"
          if [ -z "$date" ]; then
            date="$(TZ=Asia/Taipei date +%F)"
          fi
          [[ "$date" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "Invalid Collector date: $date"
            exit 1
          }

          base_sha="$(git rev-parse HEAD)"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          done="data/publish/$date.done.json"
          if [ -f "$done" ]; then
            state="$(python - "$done" <<'PY'
          import json,sys
          print(str(json.load(open(sys.argv[1], encoding='utf-8')).get('state','')).upper())
          PY
            )"
            if [ "$state" = "DONE" ]; then
              echo "Already DONE for $date; Collector is a no-op."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Unexpected non-DONE receipt exists: $done"
            exit 1
          fi

          queued="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/intelligence-build.yml/runs?branch=main&status=queued&per_page=100" --jq '.total_count')"
          running="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/intelligence-build.yml/runs?branch=main&status=in_progress&per_page=100" --jq '.total_count')"
          active=$((queued + running))
          if [ "$active" -ne 0 ]; then
            echo "Canonical writer already active ($active); Collector will not create another session."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          session="data/candidates/collection-session/$date.json"
          if [ -f "$session" ]; then
            echo "Existing Collector session without DONE requires diagnosis; refusing overwrite: $session"
            exit 1
          fi

      - name: Validate existing DONE release on safe rerun
        if: steps.preflight.outputs.skip == 'true'
        shell: bash
        env:
          DATE: ${{ steps.preflight.outputs.date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="data/publish/$DATE.done.json"
          test -f "$receipt" || { echo "Safe rerun skip was not backed by a DONE receipt: $receipt"; exit 1; }
          eval "$(
            python - "$receipt" <<'PY'
          import json, shlex, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          if str(data.get('state','')).upper() != 'DONE':
              raise SystemExit('receipt state is not DONE')
          if str((data.get('qa') or {}).get('pages','')).lower() != 'pass':
              raise SystemExit('receipt Pages QA is not pass')
          publish=str(data.get('publish_commit_sha') or '').strip()
          site=str(data.get('site_url') or '').strip()
          daily=str(data.get('daily_url') or '').strip()
          if len(publish) != 40 or not site or not daily:
              raise SystemExit('receipt missing publish SHA/site/daily URL')
          print('PUBLISH_SHA='+shlex.quote(publish))
          print('SITE_URL='+shlex.quote(site))
          print('DAILY_URL='+shlex.quote(daily))
          PY
          )"
          python scripts/wait_for_pages_deployment.py "$PUBLISH_SHA"
          python scripts/verify_pages_publish.py "$DATE" --base-url "$SITE_URL" --attempts 1 --delay 5
          python - "$DAILY_URL" <<'PY'
          import sys, requests
          url=sys.argv[1]
          r=requests.get(url, headers={'User-Agent':'ai3d-safe-rerun-validator/1.0'}, timeout=20)
          r.raise_for_status()
          print(f'SAFE RERUN DAILY URL PASS: {url} status={r.status_code}')
          PY
          echo "SAFE RERUN VERIFIED: $DATE publish_sha=$PUBLISH_SHA"

      - name: Validate autonomous Collector source/runtime contract
        if: steps.preflight.outputs.skip != 'true'
        run: python scripts/check_collector_runtime_contract.py

      - name: Run genuine source-grounded Discovery and build Collector artifacts
        if: steps.preflight.outputs.skip != 'true'
        shell: bash
        env:
          DATE: ${{ steps.preflight.outputs.date }}
        run: python scripts/run_daily_collector.py "$DATE"

      - name: Validate Collector session and canonical/private boundary
        if: steps.preflight.outputs.skip != 'true'
        shell: bash
        env:
          DATE: ${{ steps.preflight.outputs.date }}
        run: |
          set -euo pipefail
          python scripts/check_collection_session_contract.py "$DATE"
          python scripts/finalize_collection_handoff.py "$DATE"

      - name: Reconfirm current main and commit only Collector artifacts
        if: steps.preflight.outputs.skip != 'true'
        shell: bash
        env:
          DATE: ${{ steps.preflight.outputs.date }}
          BASE_SHA: ${{ steps.preflight.outputs.base_sha }}
        run: |
          set -euo pipefail

          expected="$(
            printf '%s\n' \
              "data/candidates/collection-session/$DATE.json" \
              "data/candidates/decision-ledger/$DATE.json" \
              "data/candidates/rolling-backlog.json" \
              "data/daily/$DATE.json" \
            | sort
          )"
          changed="$(git status --porcelain | sed 's/^...//' | sort)"
          test "$changed" = "$expected" || {
            echo "Collector changed paths outside the allowed canonical/private boundary:"
            printf '%s\n' "$changed"
            exit 1
          }

          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$BASE_SHA" || {
            echo "Current main moved during Collector execution: base=$BASE_SHA current=$current_main"
            exit 1
          }

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            "data/daily/$DATE.json" \
            "data/candidates/collection-session/$DATE.json" \
            "data/candidates/decision-ledger/$DATE.json" \
            "data/candidates/rolling-backlog.json"

          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = "$expected" || {
            echo "Unexpected staged Collector paths:"
            printf '%s\n' "$staged"
            exit 1
          }

          git commit -m "Collect production intelligence $DATE"
          git push origin HEAD:main

      - name: Collector summary
        if: success()
        run: |
          echo "## Autonomous Collector completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Date: ${{ steps.preflight.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skip: ${{ steps.preflight.outputs.skip }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public surfaces were not committed." >> "$GITHUB_STEP_SUMMARY"
          echo "- Collector handoff is delegated to collector-handoff.yml via workflow_run; this path is exercised by collector-test commits." >> "$GITHUB_STEP_SUMMARY"
