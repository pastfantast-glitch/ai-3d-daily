name: Migrate daily 20-30 contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-daily-20-30.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked pipeline dependencies
        run: pip install -r requirements-pipeline.txt
      - name: Apply 20-30 migration
        run: python scripts/migrate_daily_20_30_once.py
      - name: Registry and collection gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_collection_contract.py
          python scripts/normalize_registry_identity.py 2026-09-04
          python scripts/check_registry_contract.py
      - name: Rebuild derived pages from canonical
        shell: bash
        run: |
          set -euo pipefail
          python scripts/enrich_full_analysis_v3.py 2026-09-04
          python scripts/normalize_release_seed.py 2026-09-04
          python scripts/render_daily_navigation.py
          python scripts/render_home_archive_links.py
          python scripts/render_information_architecture.py 2026-09-04
          python scripts/build_intelligence.py 2026-09-04
          python scripts/check_release_input.py 2026-09-04
      - name: Refresh and inject 2026-09-04 visual evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/extract_visual_assets.py 2026-09-04
          python scripts/inject_visual_previews.py 2026-09-04
          python scripts/apply_cache_bust.py 2026-09-04
      - name: Full release and historical QA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_pipeline_contract.py
          python scripts/check_intelligence_contract.py
          python scripts/check_visual_contract.py 2026-09-04
          python scripts/check_home_contract.py
          python scripts/check_daily_contract.py
          python scripts/check_information_architecture.py 2026-09-04
          python scripts/check_historical_regression.py --days 4
      - name: Commit migrated contract and ready marker
        shell: bash
        run: |
          set -euo pipefail
          printf 'READY 2026-09-04 daily-total-20-30\n' > data/publish/2026-09-04.ready
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/migrate-daily-20-30.yml scripts/migrate_daily_20_30_once.py
          git add -A
          git commit -m 'Adopt 20-30 daily release gate and ready 2026-09-04'
          git pull --rebase origin main
          git push origin HEAD:main
