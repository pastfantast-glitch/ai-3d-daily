name: Homepage contract QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'shared-components.css'
      - 'home.css'
      - 'home-content.css'
      - 'home-components.css'
      - 'home.js'
      - 'scripts/check_home_contract.py'
      - 'scripts/repair_daily_state.py'
      - 'scripts/inject_visual_previews.py'
      - 'requirements-pipeline.txt'
      - '.github/workflows/homepage-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-contract-qa
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked pipeline dependencies
        run: pip install -r requirements-pipeline.txt
      - name: Validate homepage structure, selectors and interactions
        run: python scripts/check_home_contract.py
