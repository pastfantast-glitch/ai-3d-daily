name: Legacy full-analysis QA (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Verify canonical full analysis only
        run: python scripts/check_intelligence_contract.py
