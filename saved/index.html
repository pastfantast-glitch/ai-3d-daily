<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的收藏｜AI 3D Daily</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../shared-components.css">
  <link rel="stylesheet" href="../saved.css?v=feedback-v2">
</head>
<body class="saved-page">
  <nav class="global-category-nav" aria-label="收藏導覽">
    <div class="page global-category-nav-inner">
      <a class="archive-nav-home" href="../">← 首頁</a>
    </div>
  </nav>
  <main class="page saved-main">
    <header class="saved-hero">
      <div>
        <p class="saved-kicker">PERSONAL LIBRARY</p>
        <h1>我的收藏</h1>
        <p>⭐ 只保存文章，不影響偏好權重、Discovery 或 Ranking。</p>
      </div>
      <div class="saved-total"><strong id="saved-count">0</strong><span>篇收藏</span></div>
    </header>

    <section class="saved-toolbar" aria-label="收藏篩選">
      <label for="saved-search">搜尋收藏</label>
      <input id="saved-search" type="search" placeholder="搜尋標題、摘要、分類或工具…" autocomplete="off">
    </section>

    <section id="saved-list" class="saved-list" aria-live="polite"></section>
    <section id="saved-empty" class="saved-empty" hidden>
      <div class="saved-empty-star">☆</div>
      <h2>目前沒有收藏</h2>
      <p>在任何情報卡片點擊星星，即可把文章加入這裡。</p>
      <a href="../">回到今天的日報</a>
    </section>
  </main>
  <script type="module" src="../saved.js?v=feedback-v2"></script>
</body>
</html>
